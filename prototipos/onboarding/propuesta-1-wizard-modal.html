<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Propuesta 1 — Wizard Modal</title>
<style>
:root {
  --color-accent: #03285B;
  --color-accent-dark: #0B1320;
  --color-accent-soft: #E7ECF3;
  --color-ink: #0B1320;
  --color-ink-soft: #6B7280;
  --color-border: #E5E7EB;
  --color-electric: #05DBF2;
  --font-body: 'Inter', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font-body);
  background: var(--color-accent-dark);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.wizard-overlay {
  position: fixed;
  inset: 0;
  background: rgba(11, 19, 32, 0.85);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 24px;
}
.wizard-modal {
  background: #fff;
  border-radius: 20px;
  max-width: 480px;
  width: 100%;
  overflow: hidden;
  box-shadow: 0 25px 60px rgba(0,0,0,0.3);
}
.wizard-header {
  background: linear-gradient(135deg, var(--color-accent) 0%, var(--color-accent-dark) 100%);
  padding: 32px 24px 24px;
  text-align: center;
  position: relative;
}
.wizard-header::after {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 0;
  right: 0;
  height: 24px;
  background: #fff;
  border-radius: 24px 24px 0 0;
}
.wizard-icon {
  width: 56px;
  height: 56px;
  background: rgba(255,255,255,0.15);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 16px;
}
.wizard-icon svg {
  width: 28px;
  height: 28px;
  stroke: var(--color-electric);
}
.wizard-title {
  color: #fff;
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 6px;
}
.wizard-subtitle {
  color: rgba(255,255,255,0.7);
  font-size: 14px;
}
.wizard-body {
  padding: 32px 24px 24px;
}
.wizard-step {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 24px;
}
.step-indicator {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--color-accent-soft);
  color: var(--color-accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 600;
  flex-shrink: 0;
}
.step-indicator.active {
  background: var(--color-accent);
  color: #fff;
}
.step-indicator.completed {
  background: var(--color-electric);
  color: var(--color-accent-dark);
}
.step-line {
  flex: 1;
  height: 2px;
  background: var(--color-border);
  position: relative;
}
.step-line::after {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  width: var(--progress, 0%);
  background: var(--color-electric);
  transition: width 0.3s ease;
}
.wizard-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--color-ink);
  margin-bottom: 8px;
}
.wizard-input {
  width: 100%;
  padding: 14px 16px;
  border: 2px solid var(--color-border);
  border-radius: 12px;
  font-size: 16px;
  font-family: var(--font-body);
  color: var(--color-ink);
  transition: border-color 0.2s ease;
  outline: none;
}
.wizard-input:focus {
  border-color: var(--color-accent);
}
.wizard-input::placeholder {
  color: var(--color-ink-soft);
}
.wizard-hint {
  font-size: 13px;
  color: var(--color-ink-soft);
  margin-top: 8px;
}
.wizard-actions {
  display: flex;
  gap: 12px;
  margin-top: 24px;
}
.btn {
  flex: 1;
  padding: 14px 20px;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  font-family: var(--font-body);
  cursor: pointer;
  transition: all 0.2s ease;
  border: none;
}
.btn-primary {
  background: var(--color-accent);
  color: #fff;
}
.btn-primary:hover {
  background: var(--color-accent-dark);
}
.btn-secondary {
  background: transparent;
  color: var(--color-ink-soft);
  border: 2px solid var(--color-border);
}
.btn-secondary:hover {
  border-color: var(--color-ink-soft);
  color: var(--color-ink);
}
.wizard-progress-text {
  text-align: center;
  font-size: 12px;
  color: var(--color-ink-soft);
  margin-top: 16px;
}
</style>
</head>
<body>

<div class="wizard-overlay">
  <div class="wizard-modal">
    <div class="wizard-header">
      <div class="wizard-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
      <div class="wizard-title">¡Bienvenido a Clarvo!</div>
      <div class="wizard-subtitle">Configura tu perfil en 2 pasos rápidos</div>
    </div>
    <div class="wizard-body">
      <div class="wizard-step">
        <div class="step-indicator active">1</div>
        <div class="step-line" style="--progress: 50%"></div>
        <div class="step-indicator">2</div>
      </div>
      <div class="wizard-label">¿Cómo te llamas?</div>
      <input type="text" class="wizard-input" placeholder="Tu nombre completo" value="">
      <div class="wizard-hint">Usaremos tu nombre para personalizar tu experiencia</div>
      <div class="wizard-actions">
        <button class="btn btn-secondary">Después</button>
        <button class="btn btn-primary">Continuar</button>
      </div>
      <div class="wizard-progress-text">Paso 1 de 2</div>
    </div>
  </div>
</div>

</body>
</html>
