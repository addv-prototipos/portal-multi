<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Propuesta 4 — Página Dedicada</title>
<style>
:root {
  --color-accent: #03285B;
  --color-accent-dark: #0B1320;
  --color-accent-soft: #E7ECF3;
  --color-ink: #0B1320;
  --color-ink-soft: #6B7280;
  --color-border: #E5E7EB;
  --color-electric: #05DBF2;
  --font-body: 'Inter', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font-body);
  background: linear-gradient(180deg, var(--color-accent-dark) 0%, var(--color-accent) 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.setup-container {
  max-width: 420px;
  width: 100%;
  text-align: center;
}
.setup-logo {
  width: 64px;
  height: 64px;
  background: rgba(255,255,255,0.1);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 24px;
}
.setup-logo svg {
  width: 32px;
  height: 32px;
  stroke: var(--color-electric);
}
.setup-title {
  color: #fff;
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 8px;
}
.setup-subtitle {
  color: rgba(255,255,255,0.7);
  font-size: 15px;
  line-height: 1.6;
  margin-bottom: 32px;
}
.setup-card {
  background: #fff;
  border-radius: 20px;
  padding: 32px 24px;
  box-shadow: 0 25px 60px rgba(0,0,0,0.25);
}
.setup-avatar {
  width: 80px;
  height: 80px;
  background: var(--color-accent-soft);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 20px;
  position: relative;
}
.setup-avatar svg {
  width: 40px;
  height: 40px;
  stroke: var(--color-accent);
}
.setup-avatar-badge {
  position: absolute;
  bottom: 0;
  right: 0;
  width: 24px;
  height: 24px;
  background: var(--color-electric);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 3px solid #fff;
}
.setup-avatar-badge svg {
  width: 12px;
  height: 12px;
  stroke: var(--color-accent-dark);
}
.setup-label {
  font-size: 14px;
  font-weight: 600;
  color: var(--color-ink);
  margin-bottom: 12px;
  text-align: left;
}
.setup-input {
  width: 100%;
  padding: 16px;
  border: 2px solid var(--color-border);
  border-radius: 12px;
  font-size: 16px;
  font-family: var(--font-body);
  color: var(--color-ink);
  outline: none;
  transition: border-color 0.2s ease;
  margin-bottom: 12px;
}
.setup-input:focus {
  border-color: var(--color-accent);
}
.setup-input::placeholder {
  color: var(--color-ink-soft);
}
.setup-benefits {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin: 20px 0;
  text-align: left;
}
.benefit {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  color: var(--color-ink-soft);
}
.benefit svg {
  width: 16px;
  height: 16px;
  stroke: var(--color-electric);
  flex-shrink: 0;
}
.setup-btn {
  width: 100%;
  padding: 16px;
  background: var(--color-accent);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  font-family: var(--font-body);
  cursor: pointer;
  transition: all 0.2s ease;
  margin-bottom: 12px;
}
.setup-btn:hover {
  background: var(--color-accent-dark);
  transform: translateY(-1px);
}
.setup-skip {
  background: none;
  border: none;
  color: var(--color-ink-soft);
  font-size: 14px;
  font-family: var(--font-body);
  cursor: pointer;
  text-decoration: underline;
  transition: color 0.2s ease;
}
.setup-skip:hover {
  color: var(--color-ink);
}
</style>
</head>
<body>

<div class="setup-container">
  <div class="setup-logo">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
    </svg>
  </div>
  <div class="setup-title">Configura tu perfil</div>
  <div class="setup-subtitle">Un paso rápido para personalizar tu experiencia en Clarvo</div>

  <div class="setup-card">
    <div class="setup-avatar">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      <div class="setup-avatar-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6L9 17l-5-5"/>
        </svg>
      </div>
    </div>
    <div class="setup-label">Tu nombre</div>
    <input type="text" class="setup-input" placeholder="Ingresa tu nombre completo">
    <div class="setup-benefits">
      <div class="benefit">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <path d="M22 4L12 14.01l-3-3"/>
        </svg>
        Comunicación personalizada con tu contador
      </div>
      <div class="benefit">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <path d="M22 4L12 14.01l-3-3"/>
        </svg>
        Identificación clara en tus solicitudes
      </div>
      <div class="benefit">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <path d="M22 4L12 14.01l-3-3"/>
        </svg>
        Experiencia más rápida en futuras visitas
      </div>
    </div>
    <button class="setup-btn">Guardar y continuar</button>
    <button class="setup-skip">Ahora no, después</button>
  </div>
</div>

</body>
</html>
