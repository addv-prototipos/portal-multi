# ──────────────────────────────────────────────────────────────────────────
# AVISO DE SEGURIDAD: todas las contraseñas/credenciales de este archivo usan
# el patrón "${VAR:-valor_por_defecto}" — SOLO para que el stack levante sin
# fricción en desarrollo local. Esos valores por defecto (changeme_*,
# admin:admin, minioadmin, etc.) son PÚBLICOS (están en este archivo, en el
# repositorio) y NUNCA deben usarse en producción. Antes de desplegar contra
# tráfico real: copia `.env.example` a `.env` y cambia TODAS las variables
# marcadas "cámbiala/cámbialas en producción" (ver README, sección
# "Variables de entorno") — en particular MYSQL_ROOT_PASSWORD, MYSQL_PASSWORD,
# ADMIN_USERS, MINIO_ROOT_PASSWORD, CONTROL_APP_PASSWORD,
# INTERNAL_CACHE_SECRET y SESSION_SECRET.
# ──────────────────────────────────────────────────────────────────────────
services:
  mysql:
    image: mysql:8.0
    container_name: portalManager-mysql
    restart: unless-stopped
    # Limite de memoria: sin esto, un pico de memoria en cualquiera de los
    # tres contenedores puede dejar sin RAM al host completo, y el OOM
    # killer del sistema operativo puede terminar matando el proceso
    # equivocado (a veces ni siquiera el que causó el problema) — eso se ve
    # como caidas random e inexplicables. Con un limite, ese contenedor en
    # particular es el que se reinicia (gracias a "restart: unless-stopped"),
    # de forma contenida y predecible, en vez de arriesgar al host entero.
    mem_limit: 1g
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-portal_facturacion}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme_app_password}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - fiscal-net
    # Solo el host local (127.0.0.1), no toda la LAN/interfaz pública —
    # sigue siendo útil para conectarte con un cliente externo (MySQL
    # Workbench/TablePlus/DBeaver) desde la MISMA máquina donde corre
    # Docker. En un servidor de producción real, lo más seguro es quitar
    # este mapeo de puertos por completo (el backend ya lo alcanza por la
    # red interna de Docker sin necesidad de publicarlo) o dejarlo detrás
    # de un firewall/VPN — nunca expuesto directo a Internet.
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    healthcheck:
      # MYSQL_PWD (variable de entorno) en vez de "-p<password>" como
      # argumento de línea de comandos: un argumento de CLI queda visible
      # en texto plano para cualquier proceso/usuario que pueda listar
      # procesos dentro del contenedor (`ps aux`/`docker top`), mientras
      # que una variable de entorno solo la puede leer el dueño del
      # proceso (o root) vía /proc/<pid>/environ — superficie de
      # exposición bastante menor para la misma contraseña. "$$" (no "$")
      # es a propósito: evita que docker compose sustituya la variable al
      # interpretar este archivo (lo que horneraría la contraseña en texto
      # plano dentro del propio comando, visible con "docker inspect") —
      # así el valor se resuelve en tiempo de ejecución, dentro del shell
      # del contenedor, a partir de la variable de entorno MYSQL_ROOT_PASSWORD
      # que ya está definida más arriba para este mismo servicio.
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h localhost -u root --silent || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  # MySQL dedicado para /control (punto 305, Fase 1) — instancia separada
  # de la del backend de tenants: aísla el PROCESO MySQL, no solo la base
  # lógica (control_tenants ya vivía separada dentro de la instancia
  # compartida, pero un incidente a nivel de proceso/credenciales de esa
  # instancia — como el del 17 sep, punto 316 — podía afectar a ambas
  # bases a la vez). Sigue en el MISMO host físico (Fase 2 — servidor
  # separado — queda pendiente de que exista esa infraestructura, ver
  # PROJECT_STATE.md punto 305). El bootstrap estándar de la imagen le da
  # a MYSQL_USER privilegios ALL PRIVILEGES sobre MYSQL_DATABASE por
  # defecto; el init script de abajo lo recorta al mismo grant angosto
  # que control_app ya usaba en la instancia compartida (sin DELETE ni
  # DROP — ver backend/scripts/lib/controlDb.js).
  mysql-control:
    image: mysql:8.0
    container_name: portalManager-mysql-control
    restart: unless-stopped
    mem_limit: 384m
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_CONTROL_ROOT_PASSWORD:-changeme_control_root_password}
      MYSQL_DATABASE: control_tenants
      MYSQL_USER: control_app
      MYSQL_PASSWORD: ${CONTROL_APP_PASSWORD:-changeme_control_app_password}
    volumes:
      - mysql_control_data:/var/lib/mysql
      - ./docker/mysql-control-init:/docker-entrypoint-initdb.d:ro
    networks:
      - fiscal-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h localhost -u root --silent || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  # Almacenamiento de archivos (constancias, imágenes de ticket, facturas)
  # — segmento 5 del plan multi-tenant, ver PROJECT_STATE.md. Reemplaza el
  # bind mount local `./uploads` (que se rompe en cuanto hay más de una
  # réplica del backend) por un bucket S3-compatible self-hosted, con un
  # prefijo por tenant dentro del mismo bucket (ver backend/utils/storage.js).
  # minio/minio en Docker Hub ya no existe (retirado por MinIO, "pull
  # access denied" confirmado en un despliegue real, 2026-09-11) — el
  # registro oficial ahora es quay.io. Pin a un tag RELEASE real (no
  # ":latest", cierra el TODO que tenía esta nota) — verificado contra la
  # API de quay.io el 2026-09-11: RELEASE.2025-09-07T16-13-09Z es el más
  # reciente y coincide con el dígest de "latest" en ese momento.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: portalManager-minio
    restart: unless-stopped
    mem_limit: 512m
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme_minio_password}
    volumes:
      - minio_data:/data
    networks:
      - fiscal-net
    # Solo la consola de administración se expone al host, y solo en
    # 127.0.0.1 (no toda la LAN/interfaz pública) — útil para inspeccionar
    # el bucket en desarrollo desde la MISMA máquina, mismo espíritu que
    # MYSQL_PORT arriba. En producción real, lo más seguro es quitar este
    # mapeo por completo o dejarlo detrás de un firewall/VPN — la consola
    # de MinIO no debería quedar alcanzable desde Internet. El puerto de
    # la API S3 (9000) NO se publica: el backend lo alcanza por la red
    # interna de Docker, igual que hace con MySQL.
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portalManager-backend
    restart: unless-stopped
    # 512m era razonable cuando se fijó este límite por primera vez, pero
    # desde entonces se agregaron exceljs (genera archivos .xlsx
    # completos en memoria) y pdf-parse (buffers el PDF completo al
    # leerlo) — ambas pueden tener picos de memoria notables con archivos
    # grandes o reportes con muchos registros. Un límite demasiado justo
    # significa que el propio Docker mata el contenedor (OOM) en esos
    # picos, y "restart: unless-stopped" lo reinicia — eso es EXACTAMENTE
    # el tipo de intermitencia que un límite generoso busca evitar, no
    # causar.
    mem_limit: 768m
    # Le da tiempo suficiente al apagado ordenado (ver server.js) para
    # terminar las peticiones en curso y cerrar el pool de MySQL con
    # calma antes de que Docker mande SIGKILL — el propio código tiene un
    # limite interno de 10s para forzar la salida si algo se traba, así
    # que 15s aquí deja margen de sobra sin alargar innecesariamente un
    # despliegue o reinicio.
    stop_grace_period: 15s
    depends_on:
      mysql:
        condition: service_healthy
      mysql-control:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      PORT: 4000
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-5}
      UPLOAD_DIR: /app/uploads
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-app}
      DB_PASSWORD: ${MYSQL_PASSWORD:-changeme_app_password}
      DB_NAME: ${MYSQL_DATABASE:-portal_facturacion}
      # Punto 305 (Fase 1): admin_auditoria vive en control_tenants
      # (obtenerPoolControl() en backend/db.js), que se movió a su propia
      # instancia (mysql-control) -- antes caía por defecto a
      # DB_HOST/DB_USER ('mysql'/'app', ALL PRIVILEGES ahí desde el
      # segmento 1), que ya no tiene los datos vigentes. Reusa el mismo
      # control_app angosto que ya usa el servicio "control" (le alcanza:
      # adminAuditoria.js solo hace CREATE/INSERT/SELECT, nunca DELETE).
      CONTROL_DB_HOST: mysql-control
      CONTROL_DB_PORT: 3306
      CONTROL_DB_USER: control_app
      CONTROL_DB_PASSWORD: ${CONTROL_APP_PASSWORD:-changeme_control_app_password}
      CONTROL_DB_NAME: control_tenants
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      ADMIN_USERS: ${ADMIN_USERS:-admin:admin}
      USO_CFDI_SYNC_URL: ${USO_CFDI_SYNC_URL:-}
      CLAVE_PROD_SERV_SYNC_URL: ${CLAVE_PROD_SERV_SYNC_URL:-https://raw.githubusercontent.com/phpcfdi/resources-sat-catalogs/master/database/data/cfdi_40_productos_servicios.sql}
      SESSION_SECRET: ${SESSION_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      NODE_ENV: production
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-portal-facturacion}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme_minio_password}
      # Segmento 9b: mismo secreto que el contenedor "control" -- protege
      # POST /internal/cache-tenant/invalidar (ver server.js). Sin esto,
      # ese endpoint queda inalcanzable (rechaza todo con 403), no roto.
      INTERNAL_CACHE_SECRET: ${INTERNAL_CACHE_SECRET:-}
    volumes:
      - ./uploads:/app/uploads
    networks:
      - fiscal-net
    expose:
      - "4000"
    security_opt:
      - no-new-privileges:true

  # App de control, en su propio contenedor por seguridad y portabilidad
  # (segmento 9b, ver PROJECT_STATE.md) -- gestión cross-tenant del ciclo
  # de vida de empresas (suspender/reactivar/dar de baja), aislada del
  # backend principal: credencial de MySQL propia y angosta (control_app,
  # solo control_tenants, sin acceso a ninguna base tenant_*), y auth
  # propia (solo ADMIN_USERS, sin tocar la BD de ningún tenant). Puede
  # desplegarse en otro servidor si hace falta -- ver README, sección
  # "App de control".
  #
  # IMPORTANTE: el usuario MySQL "control_app" no existe hasta que corras
  # (una vez) backend/scripts/provisionar-tenant.js o
  # cutover-tenant-piloto.js con CONTROL_APP_PASSWORD definido en el
  # entorno -- ese script es el que lo crea (requiere privilegios root,
  # que ningún contenedor tiene montados). Sin eso, este servicio arranca
  # pero /control responde error de conexión hasta que lo corras.
  control:
    build:
      context: ./control
      dockerfile: Dockerfile
    container_name: portalManager-control
    restart: unless-stopped
    mem_limit: 256m
    stop_grace_period: 10s
    depends_on:
      mysql:
        condition: service_healthy
      mysql-control:
        condition: service_healthy
    # Punto 247 — .env montado para que /control pueda gestionar ADMIN_USERS
    # escribiendo en el archivo del host (híbrido .env + BD, con .env como
    # fuente de verdad en disco si la UI falla). Se le darán permisos de
    # escritura en el host como indicó el usuario.
    # Bug real corregido (2026-09-10): el montaje original apuntaba a
    # "/app/.env" — el Dockerfile de control usa WORKDIR /usr/src/app (sin
    # ningún directorio "/app"), así que Docker creaba "/app" como
    # directorio nuevo, propiedad de root, sin permiso de escritura para
    # "appuser" (el usuario sin privilegios con el que corre el proceso) —
    # cualquier escritura fallaba con EACCES al crear el archivo temporal
    # del guardado atómico. Corregido a la ruta real de la app.
    volumes:
      - ./.env:/usr/src/app/.env:rw
    environment:
      PORT: 4001
      ADMIN_USERS_ENV_PATH: /usr/src/app/.env
      ADMIN_USERS: ${ADMIN_USERS:-admin:admin}
      # Punto 305 (Fase 1): instancia MySQL propia, ya no la compartida
      # con el backend de tenants (mysql) — ver servicio mysql-control
      # arriba. TENANT_DB_HOST de abajo se queda explícito en "mysql" a
      # propósito: sigue siendo donde viven las bases físicas tenant_* de
      # verdad, nada que ver con dónde vive control_tenants.
      CONTROL_DB_HOST: mysql-control
      CONTROL_DB_PORT: 3306
      CONTROL_DB_USER: control_app
      CONTROL_DB_PASSWORD: ${CONTROL_APP_PASSWORD:-changeme_control_app_password}
      CONTROL_DB_NAME: control_tenants
      # Segmento 9c: infra de la BD física que recibirán los tenants
      # capturados por el intake de "Nueva empresa" (ver .env.example) —
      # por defecto la misma instancia MySQL compartida.
      TENANT_DB_HOST: ${TENANT_DB_HOST:-mysql}
      TENANT_DB_USER: ${TENANT_DB_USER:-app}
      BACKEND_INTERNAL_URL: http://backend:4000
      INTERNAL_CACHE_SECRET: ${INTERNAL_CACHE_SECRET:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
    networks:
      - fiscal-net
    expose:
      - "4001"
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portalManager-frontend
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      backend:
        # No solo espera a que el CONTENEDOR arranque (lo que hacía
        # antes, con la sintaxis corta "depends_on: - backend") — espera a
        # que su healthcheck pase (ver Dockerfile del backend, que ya
        # traía un HEALTHCHECK definido pero que docker-compose nunca
        # estaba usando para esta espera). Sin esto, nginx podía arrancar
        # y empezar a recibir tráfico antes de que el backend hubiera
        # terminado de preparar el esquema de la base de datos —
        # peticiones muy tempranas fallarían sin motivo aparente.
        condition: service_healthy
      control:
        condition: service_healthy
    environment:
      # Segmento 9b: a dónde reenviar /api/control/* -- por defecto el
      # servicio "control" de este mismo docker-compose.yml, en la misma
      # red Docker. Si ese contenedor se despliega en otro servidor,
      # cambia estas dos por su host/IP/dominio real (ver README).
      CONTROL_UPSTREAM_HOST: ${CONTROL_UPSTREAM_HOST:-control}
      CONTROL_UPSTREAM_PORT: ${CONTROL_UPSTREAM_PORT:-4001}
    # Puerto 80 por defecto (antes 8080) — para que el sitio se vea en
    # http://localhost directamente, sin tener que agregar un puerto a
    # la URL. Sigue siendo configurable con la variable FRONTEND_PORT
    # (ej. si el 80 del host ya está ocupado por otra cosa).
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - fiscal-net
    security_opt:
      - no-new-privileges:true

networks:
  fiscal-net:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  mysql_control_data:
    driver: local
  minio_data:
    driver: local
