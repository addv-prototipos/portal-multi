# ──────────────────────────────────────────────────────────────────────────
# AVISO DE SEGURIDAD: todas las contraseñas/credenciales de este archivo usan
# el patrón "${VAR:-valor_por_defecto}" — SOLO para que el stack levante sin
# fricción en desarrollo local. Esos valores por defecto (changeme_*,
# admin:admin, minioadmin, etc.) son PÚBLICOS (están en este archivo, en el
# repositorio) y NUNCA deben usarse en producción. Antes de desplegar contra
# tráfico real: copia `.env.example` a `.env` y cambia TODAS las variables
# marcadas "cámbiala/cámbialas en producción" (ver README, sección
# "Variables de entorno") — en particular MYSQL_ROOT_PASSWORD, MYSQL_PASSWORD,
# MINIO_ROOT_PASSWORD, CONTROL_APP_PASSWORD, INTERNAL_CACHE_SECRET,
# SESSION_SECRET y DB_DROP_PASSWORD (hallazgo M-14, 2026-10-15).
# ADMIN_USERS es la EXCEPCIÓN: desde el hallazgo M-11 (sonar.html,
# 2026-10-15) ya NO vive en este .env — vive en admin-users.env (copia
# admin-users.env.example antes del primer `docker compose up`), un
# archivo dedicado y más angosto que control/ monta y escribe en
# caliente desde su pantalla "Super Admins" sin tocar ningún otro
# secreto del stack.
# ──────────────────────────────────────────────────────────────────────────
services:
  mysql:
    image: mysql:8.0
    container_name: portalManager-mysql
    restart: unless-stopped
    # Limite de memoria: sin esto, un pico de memoria en cualquiera de los
    # tres contenedores puede dejar sin RAM al host completo, y el OOM
    # killer del sistema operativo puede terminar matando el proceso
    # equivocado (a veces ni siquiera el que causó el problema) — eso se ve
    # como caidas random e inexplicables. Con un limite, ese contenedor en
    # particular es el que se reinicia (gracias a "restart: unless-stopped"),
    # de forma contenida y predecible, en vez de arriesgar al host entero.
    mem_limit: 1g
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-portal_facturacion}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme_app_password}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - fiscal-net
    # Solo el host local (127.0.0.1), no toda la LAN/interfaz pública —
    # sigue siendo útil para conectarte con un cliente externo (MySQL
    # Workbench/TablePlus/DBeaver) desde la MISMA máquina donde corre
    # Docker. En un servidor de producción real, lo más seguro es quitar
    # este mapeo de puertos por completo (el backend ya lo alcanza por la
    # red interna de Docker sin necesidad de publicarlo) o dejarlo detrás
    # de un firewall/VPN — nunca expuesto directo a Internet.
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    healthcheck:
      # MYSQL_PWD (variable de entorno) en vez de "-p<password>" como
      # argumento de línea de comandos: un argumento de CLI queda visible
      # en texto plano para cualquier proceso/usuario que pueda listar
      # procesos dentro del contenedor (`ps aux`/`docker top`), mientras
      # que una variable de entorno solo la puede leer el dueño del
      # proceso (o root) vía /proc/<pid>/environ — superficie de
      # exposición bastante menor para la misma contraseña. "$$" (no "$")
      # es a propósito: evita que docker compose sustituya la variable al
      # interpretar este archivo (lo que horneraría la contraseña en texto
      # plano dentro del propio comando, visible con "docker inspect") —
      # así el valor se resuelve en tiempo de ejecución, dentro del shell
      # del contenedor, a partir de la variable de entorno MYSQL_ROOT_PASSWORD
      # que ya está definida más arriba para este mismo servicio.
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h localhost -u root --silent || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  # MySQL dedicado para /control (punto 305, Fase 1) — instancia separada
  # de la del backend de tenants: aísla el PROCESO MySQL, no solo la base
  # lógica (control_tenants ya vivía separada dentro de la instancia
  # compartida, pero un incidente a nivel de proceso/credenciales de esa
  # instancia — como el del 17 sep, punto 316 — podía afectar a ambas
  # bases a la vez). Sigue en el MISMO host físico (Fase 2 — servidor
  # separado — queda pendiente de que exista esa infraestructura, ver
  # PROJECT_STATE.md punto 305). El bootstrap estándar de la imagen le da
  # a MYSQL_USER privilegios ALL PRIVILEGES sobre MYSQL_DATABASE por
  # defecto; el init script de abajo lo recorta al mismo grant angosto
  # que control_app ya usaba en la instancia compartida (sin DELETE ni
  # DROP — ver backend/scripts/lib/controlDb.js).
  mysql-control:
    image: mysql:8.0
    container_name: portalManager-mysql-control
    restart: unless-stopped
    mem_limit: 384m
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_CONTROL_ROOT_PASSWORD:-changeme_control_root_password}
      MYSQL_DATABASE: control_tenants
      MYSQL_USER: control_app
      MYSQL_PASSWORD: ${CONTROL_APP_PASSWORD:-changeme_control_app_password}
      # Punto 345: backend necesita un usuario CON privilegio DELETE en
      # control_tenants (para borrar tenant_eventos/api_credenciales/
      # tenants al eliminar un tenant para siempre) — control_app se
      # queda angosto a propósito (nunca gana DELETE), así que backend
      # usa el mismo usuario "app" que ya tiene ALL PRIVILEGES aquí desde
      # el segmento 1 (antes de la Fase 1, cuando esta base vivía en la
      # instancia compartida). Mismo password que ya usa en `mysql` — el
      # init script de abajo (02-crear-usuario-app.sh) lo lee de esta
      # variable para crear el usuario en el primer arranque.
      APP_DB_PASSWORD: ${MYSQL_PASSWORD:-changeme_app_password}
    volumes:
      - mysql_control_data:/var/lib/mysql
      - ./docker/mysql-control-init:/docker-entrypoint-initdb.d:ro
    networks:
      - fiscal-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h localhost -u root --silent || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  # Almacenamiento de archivos (constancias, imágenes de ticket, facturas)
  # — segmento 5 del plan multi-tenant, ver PROJECT_STATE.md. Reemplaza el
  # bind mount local `./uploads` (que se rompe en cuanto hay más de una
  # réplica del backend) por un bucket S3-compatible self-hosted, con un
  # prefijo por tenant dentro del mismo bucket (ver backend/utils/storage.js).
  #
  # Punto 415 (2026-10-23): esto YA NO es MinIO. quay.io/minio/minio cerró
  # el pull anónimo (401 confirmado incluso completando el handshake de
  # token a mano), bitnami/minio es de paga ("Bitnami Secure Images"),
  # y hasta el binario directo de dl.min.io responde 410 Gone — las 3
  # vías de distribución gratuita de MinIO quedaron cerradas el mismo
  # día. Reemplazo por Garage (dxflrs/garage, AGPLv3, activo en Docker
  # Hub), S3-compatible — `backend/utils/storage.js` NO cambió una sola
  # línea (mismo `forcePathStyle: true`, mismas variables
  # MINIO_ENDPOINT/MINIO_BUCKET/MINIO_ROOT_USER/MINIO_ROOT_PASSWORD, ver
  # bloque `backend` abajo; solo se agregó MINIO_REGION porque Garage, a
  # diferencia de MinIO, SÍ valida la región contra `s3_region` de
  # docker/garage/garage.toml). Un nodo único, sin replicación
  # (`replication_factor = 1` en ese mismo archivo) — suficiente para
  # desarrollo local, nunca el patrón de un cluster real. El layout +
  # bucket + access key se crean una sola vez vía el servicio
  # `garage-init` (ver abajo), no con variables de entorno simples como
  # hacía MinIO.
  garage:
    image: dxflrs/garage:v1.1.0
    container_name: portalManager-garage
    restart: unless-stopped
    mem_limit: 512m
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/data/meta
      - garage_data:/data/data
    networks:
      - fiscal-net
    # Mismo criterio que la consola de MinIO antes: solo se expone al
    # host, y solo en 127.0.0.1 — útil para inspeccionar el cluster en
    # desarrollo desde la MISMA máquina, nunca alcanzable desde la LAN.
    # El puerto S3 (9000) SÍ se publica (a partir de este punto,
    # 2026-10-23, petición explícita del usuario) para poder usar un
    # cliente S3 gráfico (Filestash, ver servicio `filestash` abajo, o
    # cualquier cliente de escritorio) apuntando a `http://localhost:9000`
    # — el backend sigue alcanzando a Garage por la red interna de
    # Docker, esta publicación es solo para inspección manual.
    ports:
      - "127.0.0.1:${GARAGE_ADMIN_PORT:-3903}:3903"
      - "127.0.0.1:${GARAGE_S3_PORT:-9000}:9000"
    healthcheck:
      # La imagen de Garage es "scratch" (sin shell, sin mc/curl) — el
      # binario mismo es el único ejecutable disponible para el
      # healthcheck, y `status` solo sale 0 si el nodo respondió RPC.
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  # One-shot: crea el layout de un solo nodo + el bucket + la access key
  # fija la primera vez que se levanta el stack (ver
  # docker/garage-init/bootstrap.sh) — Garage, a diferencia de MinIO, no
  # trae un bucket/credencial listos solo con variables de entorno.
  # Seguro de re-correr en cada `docker compose up` (cada paso comprueba
  # primero si ya existe); `backend` espera a que este contenedor termine
  # bien antes de arrancar.
  garage-init:
    build:
      context: ./docker/garage-init
      dockerfile: Dockerfile
    container_name: portalManager-garage-init
    restart: "no"
    depends_on:
      garage:
        condition: service_healthy
    environment:
      # Mismo admin_token fijo de docker/garage/garage.toml (solo
      # desarrollo local — ver el comentario de ese archivo).
      GARAGE_ADMIN_TOKEN: "73cb415694303326cf86233f549ca56c57eaa7472c2c5f83"
      MINIO_BUCKET: ${MINIO_BUCKET:-portal-facturacion}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-GKd6b0c9c980d2b76be32856fb}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cae3aeaff02da6ecf3c70081fd7719ec6d7e1f0b29bd66d2d3235f8838b1013e}
    networks:
      - fiscal-net
    security_opt:
      - no-new-privileges:true

  # Interfaz web gráfica para el bucket de Garage (petición explícita del
  # usuario, 2026-10-23) — Garage no trae consola propia (a diferencia de
  # MinIO). Filestash (AGPLv3, machines/filestash en Docker Hub): cliente
  # S3 genérico con UI moderna (navegador de archivos tipo Explorer,
  # subir/bajar/previsualizar, sin instalar nada en el host). Se conecta
  # a Garage por el puerto S3 publicado arriba (127.0.0.1:9000) usando la
  # MISMA access key/secret que usa el backend — ver docker/filestash/
  # para el backend S3 pre-cargado en el primer arranque (config.json vía
  # volumen, evita tener que teclear host/puerto/bucket a mano en la UI
  # cada vez que se recrea el volumen). El password de administración de
  # Filestash SÍ se configura a mano la primera vez (su propio asistente
  # de /admin/setup, sin variable de entorno para preseedearlo) — ver
  # README/test.md para el valor usado en este equipo.
  filestash:
    image: machines/filestash:latest
    container_name: portalManager-filestash
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      garage:
        condition: service_healthy
    volumes:
      - filestash_data:/app/data/state
    ports:
      - "127.0.0.1:${FILESTASH_PORT:-8334}:8334"
    networks:
      - fiscal-net
    security_opt:
      - no-new-privileges:true

  # Puente WebDAV al bucket de Garage (punto 415, 2026-10-23) — reemplaza
  # a Filestash como la forma recomendada de navegar el bucket: Filestash
  # pide credenciales por sesión de navegador en una pantalla "Access Key
  # ID / Secret Access Key / Advanced" que resultó confusa de usar. Con
  # WebDAV, Windows monta el bucket como una unidad de red normal — se ve
  # y se usa como una carpeta del Explorador (arrastrar y soltar, sin
  # login, sin formularios). rclone (MIT) ya trae `serve webdav`; las
  # credenciales de Garage viven en docker/rclone-webdav/rclone.conf
  # (mismo criterio que el admin_token de Garage — fijo, solo desarrollo
  # local). Filestash se deja corriendo por si se prefiere la vista web.
  rclone-webdav:
    image: rclone/rclone:latest
    container_name: portalManager-rclone-webdav
    restart: unless-stopped
    mem_limit: 128m
    command:
      - serve
      - webdav
      - garage:portal-facturacion
      - --addr=:8080
      - --user=clarvo
      - --pass=garage2026
      - --config=/config/rclone/rclone.conf
      # Plantilla propia (navy/cian, Inter, SVG feather-like, sin
      # emojis — mismos lineamientos de marca que el resto del sitio,
      # ver CLAUDE.md) para la vista HTML que rclone sirve de regalo
      # junto con WebDAV (se usa solo si alguien abre la URL en el
      # navegador en vez de montarla como unidad de red). Variables
      # documentadas por `rclone serve webdav --help` (.Entries/.
      # Breadcrumb/.Sort/.Order) — verificado real contra el bucket
      # antes de montarla aquí.
      - --template=/config/template.html
    depends_on:
      garage:
        condition: service_healthy
    volumes:
      - ./docker/rclone-webdav/rclone.conf:/config/rclone/rclone.conf:ro
      - ./docker/rclone-webdav/template.html:/config/template.html:ro
    ports:
      - "127.0.0.1:${RCLONE_WEBDAV_PORT:-8899}:8080"
    networks:
      - fiscal-net
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portalManager-backend
    restart: unless-stopped
    # 512m era razonable cuando se fijó este límite por primera vez, pero
    # desde entonces se agregaron exceljs (genera archivos .xlsx
    # completos en memoria) y pdf-parse (buffers el PDF completo al
    # leerlo) — ambas pueden tener picos de memoria notables con archivos
    # grandes o reportes con muchos registros. Un límite demasiado justo
    # significa que el propio Docker mata el contenedor (OOM) en esos
    # picos, y "restart: unless-stopped" lo reinicia — eso es EXACTAMENTE
    # el tipo de intermitencia que un límite generoso busca evitar, no
    # causar.
    mem_limit: 768m
    # Le da tiempo suficiente al apagado ordenado (ver server.js) para
    # terminar las peticiones en curso y cerrar el pool de MySQL con
    # calma antes de que Docker mande SIGKILL — el propio código tiene un
    # limite interno de 10s para forzar la salida si algo se traba, así
    # que 15s aquí deja margen de sobra sin alargar innecesariamente un
    # despliegue o reinicio.
    stop_grace_period: 15s
    depends_on:
      mysql:
        condition: service_healthy
      mysql-control:
        condition: service_healthy
      garage:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    # Hallazgo M-11 (sonar.html, 2026-10-15): ADMIN_USERS se lee de este
    # archivo dedicado (ver admin-users.env.example) en vez de
    # interpolarse desde el .env principal — así un cambio hecho en
    # caliente desde /control (que escribe directo en admin-users.env,
    # nunca en el .env principal) sobrevive un restart de este servicio
    # también, sin que backend necesite montar ningún archivo.
    env_file:
      - ./admin-users.env
    environment:
      PORT: 4000
      UPLOAD_DIR: /app/uploads
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-app}
      DB_PASSWORD: ${MYSQL_PASSWORD:-changeme_app_password}
      DB_NAME: ${MYSQL_DATABASE:-portal_facturacion}
      # Hallazgo M-14 (sonar.html, 2026-10-15): credencial NUEVA y
      # separada, usada EXCLUSIVAMENTE por eliminarBaseDeDatosTenant()
      # (backend/db.js) para el único DROP DATABASE real del proyecto —
      # nunca por las ~90 rutas parametrizadas de arriba, que siguen con
      # DB_USER/DB_PASSWORD (ahora sin privilegio DROP, ver
      # backend/scripts/lib/controlDb.js). Mismo usuario que crea/rota
      # asegurarControlYPrivilegios() cuando se corre
      # provisionar-tenant.js/cutover-tenant-piloto.js con
      # DB_DROP_PASSWORD definido en el entorno (opcional ahí, igual
      # criterio que CONTROL_APP_PASSWORD).
      DB_DROP_USER: ${DB_DROP_USER:-app_tenant_drop}
      DB_DROP_PASSWORD: ${DB_DROP_PASSWORD:-changeme_app_drop_password}
      # Punto 305 (Fase 1): admin_auditoria vive en control_tenants
      # (obtenerPoolControl() en backend/db.js), que se movió a su propia
      # instancia (mysql-control) -- antes caía por defecto a
      # DB_HOST/DB_USER ('mysql'/'app'), que ya no tiene los datos
      # vigentes. Usa "app" (mismo password que en `mysql`, vía
      # MYSQL_PASSWORD) en vez de "control_app": el punto 345 (eliminar
      # tenant para siempre) reutiliza este MISMO pool para borrar filas
      # de tenant_eventos/api_credenciales/tenants, y control_app no
      # tiene privilegio DELETE ahí (angosto a propósito) — probado
      # contra Docker real, un intento con control_app tumbaba el
      # backend entero (promesa rechazada sin atrapar). "app" ya tenía
      # ALL PRIVILEGES sobre control_tenants desde el segmento 1 (ver
      # backend/scripts/lib/controlDb.js) — el init script
      # docker/mysql-control-init/02-crear-usuario-app.sh lo recrea en
      # la instancia nueva.
      CONTROL_DB_HOST: mysql-control
      CONTROL_DB_PORT: 3306
      CONTROL_DB_USER: ${MYSQL_USER:-app}
      CONTROL_DB_PASSWORD: ${MYSQL_PASSWORD:-changeme_app_password}
      CONTROL_DB_NAME: control_tenants
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      USO_CFDI_SYNC_URL: ${USO_CFDI_SYNC_URL:-}
      CLAVE_PROD_SERV_SYNC_URL: ${CLAVE_PROD_SERV_SYNC_URL:-https://raw.githubusercontent.com/phpcfdi/resources-sat-catalogs/master/database/data/cfdi_40_productos_servicios.sql}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # true a partir de M-18 (sonar_1.1.html, 2026-10-19): con
      # NODE_ENV=production, authUsuario.js ya hace secure=true SIEMPRE y
      # aborta el arranque si esta variable llega en "false" — dejarla en
      # "false" aquí (el default de antes) ya ni siquiera arranca. Sigue
      # funcionando en http://localhost (los navegadores modernos guardan
      # cookies Secure ahí aunque no haya HTTPS real) — se rompe SOLO si
      # pruebas por IP de LAN sin HTTPS (http://192.168.x.x), caso ya
      # documentado como excepción, no el uso diario.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      NODE_ENV: production
      MINIO_ENDPOINT: http://garage:9000
      # Garage, a diferencia de MinIO, valida la región contra
      # `s3_region` de docker/garage/garage.toml — sin esto el SDK manda
      # "us-east-1" por default y Garage rechaza toda operación
      # (confirmado real: HeadBucket falla con región equivocada).
      MINIO_REGION: garage
      MINIO_BUCKET: ${MINIO_BUCKET:-portal-facturacion}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-GKd6b0c9c980d2b76be32856fb}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cae3aeaff02da6ecf3c70081fd7719ec6d7e1f0b29bd66d2d3235f8838b1013e}
      # Segmento 9b: mismo secreto que el contenedor "control" -- protege
      # POST /internal/cache-tenant/invalidar (ver server.js). Sin esto,
      # ese endpoint queda inalcanzable (rechaza todo con 403), no roto.
      INTERNAL_CACHE_SECRET: ${INTERNAL_CACHE_SECRET:-}
      # Compra de upscale desde Mi Cuenta (propuesta B5): backend llama a
      # control en sentido contrario al de arriba (control -> backend), vía
      # /internal/upscale/simular y /internal/upscale/confirmar, con el
      # mismo INTERNAL_CACHE_SECRET. Nombre del servicio Docker, mismo
      # patrón que BACKEND_INTERNAL_URL en el servicio "control" abajo.
      CONTROL_INTERNAL_URL: http://control:4001
      # Hallazgo m-01 (sonar_1.1.html, Fase D, punto 410): DOCS_ENABLED
      # se invirtió a opt-in (apagado por defecto) -- se enciende aquí
      # explícito para no perder Swagger en desarrollo local. prod/ NUNCA
      # debe definir esta variable.
      DOCS_ENABLED: 'true'
    volumes:
      - ./uploads:/app/uploads
    networks:
      - fiscal-net
    expose:
      - "4000"
    security_opt:
      - no-new-privileges:true

  # App de control, en su propio contenedor por seguridad y portabilidad
  # (segmento 9b, ver PROJECT_STATE.md) -- gestión cross-tenant del ciclo
  # de vida de empresas (suspender/reactivar/dar de baja), aislada del
  # backend principal: credencial de MySQL propia y angosta (control_app,
  # solo control_tenants, sin acceso a ninguna base tenant_*), y auth
  # propia (solo ADMIN_USERS, sin tocar la BD de ningún tenant). Puede
  # desplegarse en otro servidor si hace falta -- ver README, sección
  # "App de control".
  #
  # IMPORTANTE: el usuario MySQL "control_app" no existe hasta que corras
  # (una vez) backend/scripts/provisionar-tenant.js o
  # cutover-tenant-piloto.js con CONTROL_APP_PASSWORD definido en el
  # entorno -- ese script es el que lo crea (requiere privilegios root,
  # que ningún contenedor tiene montados). Sin eso, este servicio arranca
  # pero /control responde error de conexión hasta que lo corras.
  control:
    build:
      context: ./control
      dockerfile: Dockerfile
    container_name: portalManager-control
    restart: unless-stopped
    mem_limit: 256m
    stop_grace_period: 10s
    depends_on:
      mysql:
        condition: service_healthy
      mysql-control:
        condition: service_healthy
    # Punto 247 — archivo montado para que /control pueda gestionar
    # ADMIN_USERS escribiendo en disco (híbrido archivo + BD, con el
    # archivo como fuente de verdad en disco si la UI falla).
    # Hallazgo M-11 (sonar.html, 2026-10-15): el mount apuntaba al `.env`
    # PRINCIPAL del stack completo (MySQL root, SESSION_SECRET,
    # INTERNAL_CACHE_SECRET, CONTROL_VAULT_KEY, MinIO/SMTP — todo) con
    # permiso de escritura — un control/ comprometido podía leer o
    # reescribir CUALQUIER secreto del stack, no solo el que administra.
    # Se le darán permisos de escritura en el host como indicó el
    # usuario — ahora sobre admin-users.env (ver admin-users.env.example),
    # un archivo dedicado SOLO a esta línea; backend/ lee el mismo
    # archivo vía `env_file:` (arriba) para que un restart tampoco pierda
    # un cambio hecho en caliente desde aquí.
    # Bug real corregido (2026-09-10): el montaje original apuntaba a
    # "/app/.env" — el Dockerfile de control usa WORKDIR /usr/src/app (sin
    # ningún directorio "/app"), así que Docker creaba "/app" como
    # directorio nuevo, propiedad de root, sin permiso de escritura para
    # "appuser" (el usuario sin privilegios con el que corre el proceso) —
    # cualquier escritura fallaba con EACCES al crear el archivo temporal
    # del guardado atómico. Corregido a la ruta real de la app (la ruta
    # DENTRO del contenedor, /usr/src/app/.env, no cambió — solo el
    # archivo del HOST que se monta ahí).
    volumes:
      - ./admin-users.env:/usr/src/app/.env:rw
      # Capacidad real de disco (punto 433, addendum 2 — hallazgo del
      # usuario, 2026-10-27): Garage reporta el filesystem ext4 DENTRO de
      # la VM de WSL2, que no coincide con el disco real de Windows
      # (confirmado real: Garage decía ~945 GB libres, C: real tenía 45 de
      # 295 GB). Este bind mount de una carpeta VACÍA y de bajo riesgo
      # (nunca la unidad completa) deja que `fs.statfsSync()` dentro del
      # contenedor lea las estadísticas REALES de la unidad donde vive esa
      # carpeta — confirmado real con un contenedor de prueba: reportó
      # 295.9/45.3 GB, exacto a lo que Windows mostraba. Ver
      # control/utils/hostDiscoCapacidad.js. HOST_DISK_PROBE_PATH
      # configurable para otra unidad/plataforma (ej. "/" en un host
      # Linux) — el default asume Windows con Docker Desktop (como este
      # entorno de desarrollo).
      - ${HOST_DISK_PROBE_PATH:-C:/ProgramData/clarvo-disk-probe}:/hostdisk:ro
    env_file:
      - ./admin-users.env
    environment:
      PORT: 4001
      ADMIN_USERS_ENV_PATH: /usr/src/app/.env
      # Punto 305 (Fase 1): instancia MySQL propia, ya no la compartida
      # con el backend de tenants (mysql) — ver servicio mysql-control
      # arriba. TENANT_DB_HOST de abajo se queda explícito en "mysql" a
      # propósito: sigue siendo donde viven las bases físicas tenant_* de
      # verdad, nada que ver con dónde vive control_tenants.
      CONTROL_DB_HOST: mysql-control
      CONTROL_DB_PORT: 3306
      CONTROL_DB_USER: control_app
      CONTROL_DB_PASSWORD: ${CONTROL_APP_PASSWORD:-changeme_control_app_password}
      CONTROL_DB_NAME: control_tenants
      # Segmento 9c: infra de la BD física que recibirán los tenants
      # capturados por el intake de "Nueva empresa" (ver .env.example) —
      # por defecto la misma instancia MySQL compartida.
      TENANT_DB_HOST: ${TENANT_DB_HOST:-mysql}
      TENANT_DB_USER: ${TENANT_DB_USER:-app}
      BACKEND_INTERNAL_URL: http://backend:4000
      INTERNAL_CACHE_SECRET: ${INTERNAL_CACHE_SECRET:-}
      # Capacidad real de disco (decisión del usuario, 2026-10-27): mismo
      # admin_token fijo de docker/garage/garage.toml (solo desarrollo
      # local) — control lo usa para leer dataPartition.total/available
      # real de Garage, nunca un valor capturado a mano. "garage" es el
      # nombre del servicio en esta misma red (fiscal-net); GARAGE_ADMIN_URL
      # queda configurable por si algún día el nodo vive en otro host.
      GARAGE_ADMIN_URL: ${GARAGE_ADMIN_URL:-http://garage:3903}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-73cb415694303326cf86233f549ca56c57eaa7472c2c5f83}
      # Punto en curso: clave de cifrado reversible para "Accesos — MinIO"
      # (ver control/utils/accesoMinio.js) — 32 bytes en hex (64
      # caracteres), SOLO en este .env, nunca en la BD. Generar con
      # node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      CONTROL_VAULT_KEY: ${CONTROL_VAULT_KEY:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      ONBOARDING_CORS_ORIGIN: ${ONBOARDING_CORS_ORIGIN:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      # Punto en curso (cobrar primero, onboarding público): control/ es
      # quien crea el Checkout Session y recibe el webhook — backend/ no
      # necesita ninguna de estas 3.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PUBLIC_APP_BASE_URL: ${PUBLIC_APP_BASE_URL:-https://clarvo.mx}
      # Hallazgo m-01 (sonar_1.1.html, Fase D, punto 410): DOCS_ENABLED
      # se invirtió a opt-in -- encendido aquí para desarrollo local;
      # prod/ nunca debe definir esta variable.
      DOCS_ENABLED: 'true'
      # Hallazgo M-06 (sonar_1.1.html, Fase D, punto 410): secret key de
      # Cloudflare Turnstile que verifica control/utils/turnstile.js antes
      # de aprovisionar un tenant real desde el onboarding público. El
      # default es el secret key PÚBLICO de prueba que documenta
      # Cloudflare (siempre aprueba, pensado para dev/CI) -- nunca un
      # secreto real. Sobreescribir con TURNSTILE_SECRET_KEY en el .env
      # del host al tener cuenta real. prod/ NUNCA debe traer un default:
      # sin esta variable, el candado falla CERRADO (rechaza el
      # onboarding) a propósito.
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-1x0000000000000000000000000000000AA}
    networks:
      - fiscal-net
    expose:
      - "4001"
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portalManager-frontend
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      backend:
        # No solo espera a que el CONTENEDOR arranque (lo que hacía
        # antes, con la sintaxis corta "depends_on: - backend") — espera a
        # que su healthcheck pase (ver Dockerfile del backend, que ya
        # traía un HEALTHCHECK definido pero que docker-compose nunca
        # estaba usando para esta espera). Sin esto, nginx podía arrancar
        # y empezar a recibir tráfico antes de que el backend hubiera
        # terminado de preparar el esquema de la base de datos —
        # peticiones muy tempranas fallarían sin motivo aparente.
        condition: service_healthy
      control:
        condition: service_healthy
    environment:
      # Segmento 9b: a dónde reenviar /api/control/* -- por defecto el
      # servicio "control" de este mismo docker-compose.yml, en la misma
      # red Docker. Si ese contenedor se despliega en otro servidor,
      # cambia estas dos por su host/IP/dominio real (ver README).
      CONTROL_UPSTREAM_HOST: ${CONTROL_UPSTREAM_HOST:-control}
      CONTROL_UPSTREAM_PORT: ${CONTROL_UPSTREAM_PORT:-4001}
    # Puerto 80 por defecto (antes 8080) — para que el sitio se vea en
    # http://localhost directamente, sin tener que agregar un puerto a
    # la URL. Sigue siendo configurable con la variable FRONTEND_PORT
    # (ej. si el 80 del host ya está ocupado por otra cosa).
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - fiscal-net
    security_opt:
      - no-new-privileges:true

networks:
  fiscal-net:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  mysql_control_data:
    driver: local
  garage_meta:
    driver: local
  garage_data:
    driver: local
  filestash_data:
    driver: local
