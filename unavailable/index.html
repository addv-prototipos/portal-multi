<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Portal Clarvo — Actualizando</title>
<style>
  :root {
    --navy-950: #030C22;
    --navy-900: #061430;
    --navy-800: #0B1F42;
    --cyan: #05DBF2;
    --cyan-soft: #6FE9FB;
    --ink-soft: #A9BEDD;
    --ink-faint: #7488AC;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--navy-950);
    color: #EAF3FB;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .escena {
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 24px;
    text-align: center;
    max-width: 560px;
  }

  /* ---------- Capas ambientales de fondo (Propuesta 6, ampliada) ---------- */
  .fondo-glow {
    position: fixed; inset: -15%; z-index: 0;
    background: radial-gradient(circle at 50% 30%, rgba(5, 219, 242, 0.08) 0%, transparent 55%);
    filter: blur(40px);
    animation: respirar-fondo 10s ease-in-out infinite;
  }
  @keyframes respirar-fondo { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

  .foco {
    position: fixed; top: -10%; left: 50%; width: 460px; height: 640px;
    transform: translateX(-50%) rotate(0deg);
    transform-origin: top center;
    background: conic-gradient(from 180deg at 50% 0%, transparent 0deg, rgba(5, 219, 242, 0.11) 10deg, transparent 22deg);
    z-index: 1; pointer-events: none;
    animation: barrer-foco 7s ease-in-out infinite;
  }
  @keyframes barrer-foco {
    0%, 100% { transform: translateX(-50%) rotate(-3deg); opacity: 0.75; }
    50% { transform: translateX(-50%) rotate(3deg); opacity: 1; }
  }

  /* Envuelve el cubo + todas sus capas de luz: posicionadas relativas a
     ESTE contenedor (no al viewport) para que siempre queden pegadas al
     cubo sin importar cuánto texto haya debajo y mueva el centrado
     vertical del body — bug real encontrado al probar la página final
     (con position:fixed + top:38%, el halo quedaba flotando sobre el
     párrafo en vez de abrazar el cubo). */
  .escenario-cubo {
    position: relative;
    width: 320px; height: 320px;
    margin: 0 auto;
    display: flex; align-items: center; justify-content: center;
  }

  .haz {
    position: absolute; top: -30%; left: 50%; width: 2px; height: 70%;
    transform: translateX(-50%);
    background: linear-gradient(to bottom, rgba(5, 219, 242, 0.5), transparent);
    z-index: 1;
    animation: pulso-haz 4s ease-in-out infinite;
  }
  @keyframes pulso-haz { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.8; } }

  .halo {
    position: absolute; top: 50%; left: 50%; width: 300px; height: 300px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(5, 219, 242, 0.22) 0%, transparent 70%);
    z-index: 1;
    animation: pulso-halo 5s ease-in-out infinite;
  }
  @keyframes pulso-halo {
    0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(0.94); }
    50% { opacity: 0.85; transform: translate(-50%, -50%) scale(1.04); }
  }

  .anillo-fino {
    position: absolute; top: 50%; left: 50%; width: 220px; height: 220px;
    transform: translate(-50%, -50%) rotateX(78deg) rotateZ(0deg);
    border: 1px solid rgba(5, 219, 242, 0.32);
    border-radius: 50%;
    z-index: 1;
    animation: girar-anillo 18s linear infinite;
  }
  @keyframes girar-anillo {
    from { transform: translate(-50%, -50%) rotateX(78deg) rotateZ(0deg); }
    to   { transform: translate(-50%, -50%) rotateX(78deg) rotateZ(360deg); }
  }
  .anillo-fino::before {
    content: ""; position: absolute; top: -2px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px;
    background: var(--cyan); border-radius: 50%; box-shadow: 0 0 8px 2px var(--cyan);
  }

  .anillo-2 {
    position: absolute; top: 50%; left: 50%; width: 270px; height: 270px;
    transform: translate(-50%, -50%) rotateX(78deg) rotateZ(90deg);
    border: 1px solid rgba(5, 219, 242, 0.14);
    border-radius: 50%;
    z-index: 1;
    animation: girar-anillo-2 26s linear infinite;
  }
  @keyframes girar-anillo-2 {
    from { transform: translate(-50%, -50%) rotateX(78deg) rotateZ(90deg); }
    to   { transform: translate(-50%, -50%) rotateX(78deg) rotateZ(-270deg); }
  }

  .particula {
    position: absolute; width: 2.5px; height: 2.5px; border-radius: 50%;
    background: var(--cyan-soft); opacity: 0.4; z-index: 1;
    animation: flotar-particula 8s ease-in-out infinite;
  }
  @keyframes flotar-particula {
    0%, 100% { opacity: 0.2; transform: translateY(0); }
    50% { opacity: 0.7; transform: translateY(-12px); }
  }

  /* ---------- Escenario 3D: cubo con el logo Clarvo en las caras ---------- */
  .stage {
    position: relative;
    z-index: 2;
    width: 120px;
    height: 120px;
    perspective: 1000px;
    margin-bottom: 8px;
  }
  .cubo {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    animation: girar-cubo 11s linear infinite;
  }
  @keyframes girar-cubo {
    from { transform: rotateX(-20deg) rotateY(0deg); }
    to   { transform: rotateX(-20deg) rotateY(360deg); }
  }
  .cara {
    position: absolute;
    width: 120px; height: 120px;
    border: 1px solid rgba(5, 219, 242, 0.4);
    background: linear-gradient(155deg, rgba(5, 219, 242, 0.14), rgba(3, 40, 91, 0.6));
    box-shadow: 0 0 24px rgba(5, 219, 242, 0.1) inset;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(1px);
  }
  .cara img { width: 58%; height: 58%; object-fit: contain; filter: drop-shadow(0 0 10px rgba(5, 219, 242, .5)); }
  .cara-frente  { transform: translateZ(60px); }
  .cara-atras   { transform: rotateY(180deg) translateZ(60px); }
  .cara-derecha { transform: rotateY(90deg) translateZ(60px); }
  .cara-izq     { transform: rotateY(-90deg) translateZ(60px); }
  .cara-arriba  { transform: rotateX(90deg) translateZ(60px); background: linear-gradient(155deg, rgba(5, 219, 242, 0.22), rgba(3, 40, 91, 0.5)); }
  .cara-arriba img { width: 46%; height: 46%; }
  .cara-abajo   { transform: rotateX(-90deg) translateZ(60px); background: rgba(2, 8, 20, 0.7); }

  .reflejo {
    position: relative; z-index: 2;
    width: 120px; height: 44px; margin: 2px auto 18px;
    background: linear-gradient(to bottom, rgba(5, 219, 242, 0.14), transparent);
    transform: scaleY(-1);
    filter: blur(2px);
    opacity: 0.5;
    animation: respirar-reflejo 5s ease-in-out infinite;
  }
  @keyframes respirar-reflejo { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.6; } }

  /* ---------- Texto ---------- */
  .etiqueta {
    position: relative; z-index: 2;
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--cyan-soft);
    background: rgba(5, 219, 242, 0.1);
    border: 1px solid rgba(5, 219, 242, 0.3);
    padding: 6px 14px;
    border-radius: 999px;
    margin: 4px 0 22px;
  }
  .etiqueta-punto { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }

  h1 { position: relative; z-index: 2; margin: 0 0 10px; font-size: 19px; font-weight: 700; color: #fff; }
  p  { position: relative; z-index: 2; margin: 0; font-size: 14px; line-height: 1.6; color: var(--ink-soft); max-width: 42ch; }

  .estado {
    position: relative; z-index: 2;
    display: inline-flex; align-items: center; gap: 8px;
    margin-top: 22px;
    font-size: 12.5px; color: var(--ink-faint);
  }
  .punto-cargando { width: 5px; height: 5px; border-radius: 50%; background: var(--cyan); animation: parpadeo 1.2s ease-in-out infinite; }
  .punto-cargando:nth-child(2) { animation-delay: 0.2s; }
  .punto-cargando:nth-child(3) { animation-delay: 0.4s; }
  @keyframes parpadeo { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }

  .reintentar {
    position: relative; z-index: 2;
    margin-top: 16px;
    padding: 10px 22px;
    border-radius: 999px;
    border: 1px solid rgba(5, 219, 242, 0.45);
    background: rgba(5, 219, 242, 0.08);
    color: #fff;
    font-family: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .reintentar:hover { background: rgba(5, 219, 242, 0.18); border-color: var(--cyan); }
  .reintentar:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

  .pie { position: relative; z-index: 2; margin-top: 24px; font-size: 11.5px; color: rgba(169, 190, 221, 0.5); }
  .pie strong { color: rgba(234, 243, 251, 0.7); font-weight: 700; }

  @media (prefers-reduced-motion: reduce) {
    .cubo { animation: none; transform: rotateX(-20deg) rotateY(-28deg); }
    .fondo-glow, .foco, .haz, .halo, .anillo-fino, .anillo-2, .particula, .reflejo, .punto-cargando {
      animation: none !important;
    }
  }
</style>
</head>
<body>
  <div class="fondo-glow" aria-hidden="true"></div>
  <div class="foco" aria-hidden="true"></div>

  <main class="escena">
    <div class="escenario-cubo">
      <div class="haz" aria-hidden="true"></div>
      <div class="anillo-2" aria-hidden="true"></div>
      <div class="halo" aria-hidden="true"></div>
      <div class="anillo-fino" aria-hidden="true"></div>
      <div class="particula" style="top:18%; left:16%; animation-delay:-1s;" aria-hidden="true"></div>
      <div class="particula" style="top:24%; left:82%; animation-delay:-3s;" aria-hidden="true"></div>
      <div class="particula" style="top:50%; left:8%; animation-delay:-5s;" aria-hidden="true"></div>
      <div class="particula" style="top:70%; left:88%; animation-delay:-2s;" aria-hidden="true"></div>
      <div class="particula" style="top:82%; left:30%; animation-delay:-6s;" aria-hidden="true"></div>
      <div class="particula" style="top:14%; left:52%; animation-delay:-4s;" aria-hidden="true"></div>
      <div class="stage" aria-hidden="true">
        <div class="cubo" id="cubo">
          <div class="cara cara-frente"></div>
          <div class="cara cara-atras"></div>
          <div class="cara cara-derecha"></div>
          <div class="cara cara-izq"></div>
          <div class="cara cara-arriba"></div>
          <div class="cara cara-abajo"></div>
        </div>
      </div>
    </div>
    <div class="reflejo" aria-hidden="true"></div>

    <span class="etiqueta"><span class="etiqueta-punto" aria-hidden="true"></span>Mantenimiento en curso</span>

    <h1>El sistema se está actualizando</h1>
    <p>Estamos aplicando una actualización al Portal Clarvo.</p>

    <div class="estado" role="status" aria-live="polite">
      <span id="texto-estado">Verificando conexión</span>
      <span class="punto-cargando"></span>
      <span class="punto-cargando"></span>
      <span class="punto-cargando"></span>
    </div>

    <button class="reintentar" id="btn-reintentar" type="button">Reintentar ahora</button>

    <p class="pie"><strong>Clarvo</strong> · tu negocio en orden</p>
  </main>

  <script>
    (function () {
      var texto = document.getElementById('texto-estado');
      var boton = document.getElementById('btn-reintentar');
      var intentos = 0;
      var intervaloMs = 6000;
      var temporizador = null;

      function verificar() {
        intentos += 1;
        texto.textContent = 'Verificando conexión (intento ' + intentos + ')';
        fetch('/', { cache: 'no-store', method: 'GET' })
          .then(function (respuesta) {
            if (respuesta.status === 200) {
              texto.textContent = 'Sitio disponible, recargando...';
              window.location.reload();
            }
          })
          .catch(function () {
            // Sigue sin conexión — el siguiente ciclo lo reintenta solo.
          });
      }

      function iniciar() {
        verificar();
        temporizador = window.setInterval(verificar, intervaloMs);
      }

      boton.addEventListener('click', function () {
        if (temporizador) { window.clearInterval(temporizador); }
        verificar();
        temporizador = window.setInterval(verificar, intervaloMs);
      });

      iniciar();
    })();
  </script>
