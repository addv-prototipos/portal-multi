# Interruptor de modo mantenimiento (punto en curso, 2026-11-06). Se
# incluye al INICIO de cada location que sirve algo directo (shell
# estático vía try_files) o que proxea a backend/control — nunca a nivel
# server{} a secas: un `return` emitido en la fase de rewrite del
# server (antes de que nginx elija ninguna location) no es interceptable
# por `error_page` — probado real, confirmado con curl -v contra un
# `return 503;` bare en server{}: siempre cae en la página 503 genérica
# de nginx, nunca en mantenimiento.html. Dentro de una location sí
# funciona, porque ahí la respuesta SÍ queda asociada al error_page de
# esa location (el de la propia location si lo tiene, si no el heredado
# de server{}).
#
# Activar: docker exec <frontend> touch /usr/share/nginx/html/.mantenimiento
# Desactivar: docker exec <frontend> rm -f /usr/share/nginx/html/.mantenimiento
if (-f /usr/share/nginx/html/.mantenimiento) {
    return 503;
}
