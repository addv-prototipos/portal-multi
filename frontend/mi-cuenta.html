<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi cuenta | Portal Clarvo tu negocio en orden</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/portal.css" />
</head>
<body class="portal-body">
  <header class="portal-header">
    <div class="portal-header-logo">
      <img src="/assets/branding_bgo.png" alt="CLARVO — Portal Clarvo tu negocio en orden by ADDV" />
    </div>
    <div class="portal-header-actions">
      <a class="btn-volver-tablero" href="dashboard.html">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M19 12H5M5 12l6-6M5 12l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="btn-volver-tablero-texto">Volver al tablero</span>
      </a>
      <span class="portal-user-label" id="portal-user-label"></span>
      <button type="button" class="btn btn-secondary" id="btn-logout">Cerrar sesión</button>
    </div>
  </header>

  <main class="portal-main">
    <h1 class="portal-titulo">Mi cuenta</h1>

    <div class="mi-cuenta-main">
    <div class="mi-cuenta-grid">
    <div class="card">
      <h2 class="mi-cuenta-card-titulo">Datos de contacto</h2>
      <form id="form-datos" novalidate>
        <div class="field">
          <label for="datos-nombre">Nombre</label>
          <input type="text" id="datos-nombre" maxlength="200" autocomplete="name" />
          <p class="field-error" id="error-datos-nombre" role="alert"></p>
        </div>
        <div class="field">
          <label for="datos-telefono">Teléfono</label>
          <input type="tel" id="datos-telefono" maxlength="20" autocomplete="tel" />
          <p class="field-error" id="error-datos-telefono" role="alert"></p>
        </div>
        <div class="field">
          <label for="datos-email">Correo</label>
          <input type="email" id="datos-email" maxlength="200" autocomplete="email" />
          <p class="field-hint" id="hint-datos-email" hidden>Si tienes movimientos de crédito, se asocian por este correo — cambiarlo puede afectar qué ves en Gestión de crédito.</p>
          <p class="field-error" id="error-datos-email" role="alert"></p>
        </div>
        <p class="field-error" id="datos-error-general" role="alert"></p>
        <button type="submit" class="btn btn-primary btn-block" id="btn-datos">
          <span id="btn-datos-label">Guardar cambios</span>
        </button>
      </form>
    </div>

    <div class="card">
      <h2 class="mi-cuenta-card-titulo">Cambiar contraseña</h2>
      <form id="form-password" novalidate>
        <div class="field">
          <label for="password-actual">Contraseña actual</label>
          <div class="password-field">
            <input type="password" id="password-actual" required autocomplete="current-password" />
            <button type="button" class="btn-toggle-pass" data-target="password-actual" aria-label="Mostrar contraseña" aria-pressed="false">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M2 12C2 12 5.5 5.5 12 5.5C18.5 5.5 22 12 22 12C22 12 18.5 18.5 12 18.5C5.5 18.5 2 12 2 12Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/>
              </svg>
            </button>
          </div>
          <p class="field-error" id="error-password-actual" role="alert"></p>
        </div>

        <div class="field">
          <label for="password-nueva">Nueva contraseña</label>
          <div class="password-field">
            <input type="password" id="password-nueva" required autocomplete="new-password" aria-describedby="password-reglas" />
            <button type="button" class="btn-toggle-pass" data-target="password-nueva" aria-label="Mostrar contraseña" aria-pressed="false">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M2 12C2 12 5.5 5.5 12 5.5C18.5 5.5 22 12 22 12C22 12 18.5 18.5 12 18.5C5.5 18.5 2 12 2 12Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/>
              </svg>
            </button>
          </div>
          <ul class="password-reglas" id="password-reglas">
            <li data-regla="longitud">Al menos 8 caracteres</li>
            <li data-regla="numero">Al menos un número</li>
            <li data-regla="minuscula">Al menos una minúscula</li>
            <li data-regla="mayuscula">Al menos una mayúscula</li>
          </ul>
          <p class="field-error" id="error-password-nueva" role="alert"></p>
        </div>

        <div class="field">
          <label for="password-confirmar">Confirma tu nueva contraseña</label>
          <div class="password-field">
            <input type="password" id="password-confirmar" required autocomplete="new-password" />
            <button type="button" class="btn-toggle-pass" data-target="password-confirmar" aria-label="Mostrar contraseña" aria-pressed="false">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M2 12C2 12 5.5 5.5 12 5.5C18.5 5.5 22 12 22 12C22 12 18.5 18.5 12 18.5C5.5 18.5 2 12 2 12Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/>
              </svg>
            </button>
          </div>
          <p class="field-error" id="error-password-confirmar" role="alert"></p>
        </div>

        <p class="field-error" id="password-error-general" role="alert"></p>
        <button type="submit" class="btn btn-primary btn-block" id="btn-password">
          <span id="btn-password-label">Actualizar contraseña</span>
        </button>
      </form>
    </div>
    </div>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="/theme.js"></script>
  <script src="/skeleton.js"></script>
  <script src="/portal.js"></script>
  <script src="/mi-cuenta.js"></script>
</body>
</html>
