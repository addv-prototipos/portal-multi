<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Widget - Utilidad Neta Mensual</title>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              navy: '#0B1E3B',
              accent: '#2563EB',
              emerald: '#10B981',
              rose: '#E11D48',
            }
          },
          boxShadow: {
            'card': '0 10px 25px -5px rgba(15, 23, 42, 0.05), 0 8px 10px -6px rgba(15, 23, 42, 0.03)',
            'tooltip': '0 8px 20px -4px rgba(11, 30, 59, 0.28)',
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Animation & SVG Styles -->
<style data-purpose="chart-styles">
    @keyframes pulse-ring {
      0% {
        transform: scale(0.95);
        opacity: 0.8;
      }
      50% {
        transform: scale(1.35);
        opacity: 0;
      }
      100% {
        transform: scale(0.95);
        opacity: 0;
      }
    }
    .pulse-effect {
      animation: pulse-ring 2.2s cubic-bezier(0.24, 0, 0.38, 1) infinite;
      transform-origin: center;
    }
    .chart-point {
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), stroke-width 0.2s ease;
      cursor: pointer;
    }
    .chart-point:hover {
      transform: scale(1.4);
    }
  </style>
<!-- END: Custom Animation & SVG Styles -->
</head>
<body class="min-h-screen bg-[#F4F6F9] flex items-center justify-center p-4 antialiased selection:bg-blue-100 selection:text-blue-700">
<!-- BEGIN: DashboardCardContainer -->
<main class="w-full max-w-[480px]">
<!-- Modern Widget Card Homologated to UX Redesign -->
<div class="relative bg-white rounded-2xl p-6 border border-slate-200/80 shadow-card hover:shadow-lg transition-all duration-300" data-purpose="monthly-profit-widget">
<!-- BEGIN: CardHeader -->
<header class="flex items-center justify-between gap-3 pb-3 border-b border-slate-100/80">
<div class="flex items-center gap-3">
<!-- Icon Container -->
<div aria-hidden="true" class="w-9 h-9 rounded-xl bg-blue-50/90 border border-blue-100/80 flex items-center justify-center text-blue-600 shadow-sm">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Titles & Period Tag -->
<div>
<div class="flex items-center gap-2">
<h1 class="text-base font-bold text-[#0B192C] tracking-tight">Utilidad neta mensual</h1>
<span class="inline-flex items-center px-1.5 py-0.5 rounded-full text-[10px] font-semibold bg-slate-100 text-slate-600 border border-slate-200/60">
                Q2-Q3
              </span>
</div>
<p class="text-[11px] text-slate-400 font-medium">Margen operativo consolidado</p>
</div>
</div>
<!-- Expand / Fullscreen Action Button -->
<button aria-label="Expandir gráfico a detalle completo" class="w-8 h-8 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100 active:scale-95 transition-all flex items-center justify-center border border-slate-200/60 focus:outline-none focus:ring-2 focus:ring-blue-500/20" title="Ver auditoría completa" type="button">
<svg class="w-4 h-4 stroke-[1.75]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</header>
<!-- END: CardHeader -->
<!-- BEGIN: MetricSummaryBanner -->
<!-- High-impact compact summary cards aligned to UX Design -->
<section class="mt-4 grid grid-cols-2 gap-3" data-purpose="kpi-summary">
<!-- Total 6M Metric -->
<div class="bg-slate-50/70 border border-slate-100 rounded-xl p-3 flex flex-col justify-between">
<div class="flex items-center justify-between text-[11px]">
<span class="text-slate-500 font-medium">Acumulado 6M</span>
<span class="text-emerald-700 bg-emerald-50 font-semibold px-1.5 py-0.5 rounded text-[10px] border border-emerald-200/60">+18.4%</span>
</div>
<p class="text-lg font-extrabold text-[#0B192C] tracking-tight mt-1">$1,510,700</p>
</div>
<!-- ATH Highlight Metric -->
<div class="bg-emerald-50/40 border border-emerald-100/80 rounded-xl p-3 flex flex-col justify-between relative overflow-hidden">
<div class="flex items-center justify-between text-[11px]">
<span class="text-emerald-900 font-semibold flex items-center gap-1">
<svg class="w-3 h-3 text-emerald-600" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M2.25 18L9 11.25l4.314 4.314a.75.75 0 001.06 0l7.376-7.376M21 8.25V4.5h-3.75" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
</svg>
              Máximo Jul
            </span>
<span class="text-[9px] font-bold text-emerald-800 bg-emerald-100/90 px-1 rounded uppercase tracking-wider">ATH</span>
</div>
<p class="text-lg font-extrabold text-emerald-700 tracking-tight mt-1">$454,300</p>
</div>
</section>
<!-- END: MetricSummaryBanner -->
<!-- BEGIN: ChartGraphicArea -->
<div class="relative mt-5 pt-3" data-purpose="vector-spline-chart">
<!-- ATH Tooltip Floating over July (Peak Point) -->
<div class="absolute -top-1 left-[58%] -translate-x-1/2 z-20 pointer-events-none drop-shadow-sm">
<div class="bg-[#0B192C] text-white px-2.5 py-1 rounded-md text-[11px] font-bold flex items-center gap-1 shadow-tooltip whitespace-nowrap border border-slate-700">
<span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
            $454.3k
          </div>
<!-- Little arrow pointing down -->
<div class="w-2 h-2 bg-[#0B192C] rotate-45 mx-auto -mt-1 border-r border-b border-slate-700"></div>
</div>
<!-- September Alert Badge (Corrected UX: Red pill indicator instead of false green) -->
<div class="absolute bottom-12 right-0 z-20 pointer-events-none drop-shadow-sm">
<div class="bg-rose-50 border border-rose-200 text-rose-700 px-2 py-0.5 rounded-md text-[10px] font-bold flex items-center gap-1 shadow-sm">
<span class="w-1.5 h-1.5 rounded-full bg-rose-500 animate-pulse"></span>
            $9.7k <span class="font-normal opacity-80">(-97%)</span>
</div>
</div>
<!-- April Starting Label -->
<div class="absolute top-24 left-2 z-10 pointer-events-none">
<span class="text-[11px] font-bold text-emerald-600 bg-emerald-50/90 px-1.5 py-0.5 rounded border border-emerald-200/50">$84.7k</span>
</div>
<!-- Main SVG Canvas -->
<svg aria-label="Curva de utilidad mensual con caída abrupta en septiembre" class="w-full h-auto overflow-visible" role="img" viewbox="0 0 420 180">
<defs>
<!-- Background Area Gradient -->
<lineargradient id="areaGradient" x1="0%" x2="0%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#2563EB" stop-opacity="0.14"></stop>
<stop offset="60%" stop-color="#3B82F6" stop-opacity="0.04"></stop>
<stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"></stop>
</lineargradient>
<!-- Stroke Path Gradient (Navy transitioning to Crimson Alert) -->
<lineargradient id="lineGrad" x1="0%" x2="100%" y1="0%" y2="0%">
<stop offset="0%" stop-color="#0B1E3B"></stop>
<stop offset="68%" stop-color="#0B1E3B"></stop>
<stop offset="78%" stop-color="#881337"></stop>
<stop offset="100%" stop-color="#E11D48"></stop>
</lineargradient>
<!-- Drop Filter for Depth -->
<filter height="130%" id="softShadow" width="130%" x="-10%" y="-10%">
<fedropshadow dx="0" dy="4" flood-color="#0B1E3B" flood-opacity="0.12" stddeviation="3"></fedropshadow>
</filter>
</defs>
<!-- Guide Lines: Baseline and Average reference -->
<!-- Average Dotted Line ($251.8k) -->
<line opacity="0.75" stroke="#93C5FD" stroke-dasharray="3 3" stroke-width="1" x1="20" x2="400" y1="88" y2="88"></line>
<text fill="#60A5FA" font-size="8.5" font-weight="600" letter-spacing="0.2" text-anchor="end" x="396" y="82">Media: $251.8k</text>
<!-- Lower Zero/Base Dotted Line -->
<line stroke="#E2E8F0" stroke-dasharray="4 4" stroke-width="1.2" x1="16" x2="404" y1="140" y2="140"></line>
<!-- Area under curve (Smoothed Bezier Path) -->
<!-- Points: Abr(30,126) -> May(105,98) -> Jun(175,76) -> Jul(245,28) -> Ago(315,36) -> Sep(385,138) -->
<path d="M 30 126
               C 65 116, 80 102, 105 98
               C 135 93, 150 82, 175 76
               C 205 68, 220 28, 245 28
               C 275 28, 295 34, 315 36
               C 345 38, 365 110, 385 138
               L 385 140 L 30 140 Z" fill="url(#areaGradient)"></path>
<!-- Primary Trend Spline Line with Gradient -->
<path d="M 30 126
               C 65 116, 80 102, 105 98
               C 135 93, 150 82, 175 76
               C 205 68, 220 28, 245 28
               C 275 28, 295 34, 315 36
               C 345 38, 365 110, 385 138" fill="none" filter="url(#softShadow)" stroke="url(#lineGrad)" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.6"></path>
<!-- July Drop-line to Baseline -->
<line opacity="0.6" stroke="#10B981" stroke-dasharray="2 3" stroke-width="1" x1="245" x2="245" y1="28" y2="140"></line>
<!-- Interactive Node Points -->
<!-- Point 1: Abr ($84.7k) -->
<circle class="chart-point" cx="30" cy="126" fill="#10B981" r="5" stroke="#FFFFFF" stroke-width="2.5"></circle>
<!-- Point 2: May ($210k) -->
<circle class="chart-point" cx="105" cy="98" fill="#FFFFFF" r="4.5" stroke="#0B1E3B" stroke-width="2.5"></circle>
<!-- Point 3: Jun ($320k) -->
<circle class="chart-point" cx="175" cy="76" fill="#FFFFFF" r="4.5" stroke="#0B1E3B" stroke-width="2.5"></circle>
<!-- Point 4: Jul ATH Record ($454.3k) with Double Ring & Pulse -->
<circle class="pulse-effect" cx="245" cy="28" fill="#10B981" opacity="0.3" r="9"></circle>
<circle class="chart-point shadow-md" cx="245" cy="28" fill="#10B981" r="5.5" stroke="#FFFFFF" stroke-width="2.5"></circle>
<!-- Point 5: Ago ($430k) -->
<circle class="chart-point" cx="315" cy="36" fill="#FFFFFF" r="4.5" stroke="#0B1E3B" stroke-width="2.5"></circle>
<!-- Point 6: Sep Warning Drop ($9.7k) -->
<circle class="pulse-effect" cx="385" cy="138" fill="#E11D48" opacity="0.35" r="9"></circle>
<circle class="chart-point shadow-sm" cx="385" cy="138" fill="#E11D48" r="5.5" stroke="#FFFFFF" stroke-width="2.5"></circle>
</svg>
<!-- X-Axis Labels -->
<nav aria-label="Meses del periodo" class="flex justify-between items-center text-xs font-medium text-slate-400 px-3 mt-1 select-none">
<span class="hover:text-slate-700 transition-colors">Abr</span>
<span class="hover:text-slate-700 transition-colors">May</span>
<span class="hover:text-slate-700 transition-colors">Jun</span>
<span class="text-emerald-600 font-bold hover:text-emerald-700 transition-colors">Jul</span>
<span class="hover:text-slate-700 transition-colors">Ago</span>
<span class="text-rose-600 font-bold hover:text-rose-700 transition-colors flex items-center gap-0.5">
            Sep<span class="text-[10px]">*</span>
</span>
</nav>
</div>
<!-- END: ChartGraphicArea -->
<!-- BEGIN: AnomalyNoticeFooter -->
<!-- Sub-callout explaining the sharp dropdown in September as shown in redesigned screen -->
<footer class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between gap-2 text-[11px]">
<div class="flex items-center gap-1.5 text-slate-500 overflow-hidden">
<span class="flex-shrink-0 w-2 h-2 rounded-full bg-amber-400"></span>
<p class="truncate font-medium">
<span class="text-slate-700 font-semibold">Cierre Sep:</span> Facturación pendiente por reconocer
          </p>
</div>
<a class="flex-shrink-0 font-semibold text-blue-600 hover:text-blue-700 flex items-center gap-0.5 transition-colors group" href="#auditoria">
<span>Auditoría</span>
<svg class="w-3.5 h-3.5 transform group-hover:translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</a>
</footer>
<!-- END: AnomalyNoticeFooter -->
</div>
</main>
<!-- END: DashboardCardContainer -->
</body></html>
